# Executive approvals portal → Azure Static Web Apps
#
# Builds exec-portal/ and publishes it to the Static Web App whose deployment token is in the
# secret AZURE_STATIC_WEB_APPS_API_TOKEN_EXEC. The API is reached through the same Azure edge as the
# client portal (portal-edge/), which forwards only the creditors-approval allow-list.
#
# Repository variable: EXEC_API_BASE  e.g. https://app-rocket-portal-edge.azurewebsites.net  (no path)
name: exec-portal → Azure Static Web Apps

on:
  push:
    branches: [main, stock/ledger-integrity]
    paths:
      - 'exec-portal/**'
      - '.github/workflows/exec-portal-swa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exec-portal-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    defaults:
      run:
        working-directory: exec-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exec-portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Inject environment (API base)
        env:
          EXEC_API_BASE: ${{ vars.EXEC_API_BASE }}
        run: |
          if [ -z "$EXEC_API_BASE" ]; then
            echo "::error::Repository variable EXEC_API_BASE is not set (e.g. https://app-rocket-portal-edge.azurewebsites.net)"; exit 1
          fi
          sed -i "s#__EXEC_API_BASE__#${EXEC_API_BASE}#g" src/environments/environment.ts
          grep -n "apiBase" src/environments/environment.ts

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EXEC }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          skip_api_build: true
          app_location: exec-portal/dist/exec-portal/browser
          output_location: ''
