<app-navbar></app-navbar>
<main class="fin-page">
  <app-page-header [crumbs]="['People and money', 'Finance']" title="Finance categories"
                   [subtitle]="loading ? 'Loading…' : summary">
    <a mat-stroked-button routerLink="/finance"><mat-icon>arrow_back</mat-icon>Finance overview</a>
  </app-page-header>

  <app-data-table tableId="finance-categories" itemName="categories" caption="Finance categories"
                  [rows]="categories" [columns]="columns" [views]="views" [rowActions]="rowActions"
                  [loading]="loading" [rowKey]="rowKey" emptyIcon="category"
                  emptyMessage="Income and expense categories set up in Finance show up here."></app-data-table>
</main>
