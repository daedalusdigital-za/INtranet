<app-navbar></app-navbar>
<main class="fin-page">
  <app-page-header [crumbs]="['People and money', 'Finance']" title="Payments"
                   [subtitle]="loading ? 'Loading…' : summary">
    <a mat-stroked-button routerLink="/finance"><mat-icon>arrow_back</mat-icon>Finance overview</a>
  </app-page-header>

  <app-data-table tableId="finance-payments" itemName="payments" caption="Payments"
                  [rows]="payments" [columns]="columns" [views]="views" [rowActions]="rowActions"
                  [loading]="loading" [rowKey]="rowKey" emptyIcon="payments"
                  emptyMessage="Payments recorded in Finance show up here."></app-data-table>
</main>
