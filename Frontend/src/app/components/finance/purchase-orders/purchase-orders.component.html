<app-navbar></app-navbar>
<main class="fin-page">
  <app-page-header [crumbs]="['People and money', 'Finance']" title="Purchase orders"
                   [subtitle]="loading ? 'Loading…' : summary">
    <a mat-stroked-button routerLink="/finance"><mat-icon>arrow_back</mat-icon>Finance overview</a>
  </app-page-header>

  <app-data-table tableId="finance-purchase-orders" itemName="purchase orders" caption="Purchase orders"
                  [rows]="purchaseOrders" [columns]="columns" [views]="views" [rowActions]="rowActions"
                  [loading]="loading" [rowKey]="rowKey" emptyIcon="shopping_cart"
                  emptyMessage="Purchase orders raised in Finance show up here."></app-data-table>
</main>
