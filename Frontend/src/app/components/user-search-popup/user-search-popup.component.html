<div class="popup-backdrop" (click)="onBackdropClick($event)">
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <h3>Start New Conversation</h3>
      <button class="close-btn" (click)="closePopup()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Search Input -->
    <div class="search-container">
      <mat-icon class="search-icon" aria-hidden="true">search</mat-icon>
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        (input)="onSearchChange()"
        placeholder="Search by name, email, department..."
        class="search-input"
        aria-label="Search people"
        autofocus>
      <button *ngIf="searchQuery" class="clear-btn" (click)="searchQuery = ''; onSearchChange()" aria-label="Clear search">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Users List -->
    <div class="users-list">
      <app-skeleton-rows *ngIf="isLoading" [rows]="5"></app-skeleton-rows>

      <app-empty-state
        *ngIf="!isLoading && filteredUsers.length === 0 && hasSearched"
        icon="person_off"
        [title]="emptyTitle"
        [message]="searchQuery ? 'Check the spelling, or search by email, position or department.' : 'Nobody else is set up for messages yet.'">
        <button *ngIf="searchQuery" mat-stroked-button (click)="searchQuery = ''; onSearchChange()">Clear the search</button>
      </app-empty-state>

      <div 
        class="user-item" 
        *ngFor="let user of filteredUsers" 
        (click)="selectUser(user)">
        <div class="user-avatar" *ngIf="!user.profilePictureUrl">
          <span class="initials">{{ getInitials(user) }}</span>
        </div>
        <img 
          *ngIf="user.profilePictureUrl" 
          [src]="user.profilePictureUrl" 
          class="user-avatar-img" 
          alt="Profile">
        <div class="user-info">
          <span class="user-name">{{ user.name }} {{ user.surname }}</span>
          <span class="user-details">
            <span *ngIf="user.position">{{ user.position }}</span>
            <span *ngIf="user.position && user.department"> • </span>
            <span *ngIf="user.department">{{ user.department }}</span>
          </span>
        </div>
        <mat-icon class="action-icon" aria-hidden="true">chat</mat-icon>
      </div>
    </div>
  </div>
</div>
