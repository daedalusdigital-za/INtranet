<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Intranet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- The app's one icon set (design review D-03). -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Apply the saved light/dark, density, text size and font before the app starts, so pages don't
       flash white (AppearanceService keeps it up to date afterwards). -->
  <script>
    try {
      var t = localStorage.getItem('ui.theme');
      // Light by default; only 'dark' or an explicit 'system' choice can turn the page dark.
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.density = localStorage.getItem('ui.density') === 'compact' ? 'compact' : 'comfortable';
      var size = localStorage.getItem('ui.textSize');
      document.documentElement.dataset.textSize = size === 'large' || size === 'xlarge' ? size : 'default';
      // Fonts other than Manrope load on demand; keep these in step with AppearanceService.
      var fonts = { inter: 'Inter:wght@400;500;600;700;800', atkinson: 'Atkinson+Hyperlegible:wght@400;700', source: 'Source+Sans+3:wght@400;500;600;700;800', system: '' };
      var font = localStorage.getItem('ui.font');
      if (!(font in fonts)) font = 'manrope';
      document.documentElement.dataset.font = font;
      if (fonts[font]) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + fonts[font] + '&display=swap';
        l.setAttribute('data-font-sheet', font);
        document.head.appendChild(l);
      }
    } catch (e) {}
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
