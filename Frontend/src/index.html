<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Intranet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- The app's one icon set (design review D-03). -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Apply the saved light/dark and density choice before the app starts, so pages don't
       flash white (AppearanceService keeps it up to date afterwards). -->
  <script>
    try {
      var t = localStorage.getItem('ui.theme');
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.density = localStorage.getItem('ui.density') === 'compact' ? 'compact' : 'comfortable';
    } catch (e) {}
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
