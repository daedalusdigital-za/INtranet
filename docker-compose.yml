services:
  # SQL Server Database
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projecttracker-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      # SECURITY: SQL Server is reachable from this host only (backup/import scripts,
      # SSMS on the server). Containers use the internal network name "database".
      - "127.0.0.1:1435:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - C:\Backups\ProjectTrackerDB:/var/opt/mssql/backup
    networks:
      - projecttracker-network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '4.0'

  # ASP.NET Core Backend with AI assistant
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: projecttracker-backend
    environment:
      # Production: no developer exception page / stack traces, no Debug-level SQL logging.
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5143
      # The default inotify file watcher recursively walks EVERY subdirectory under the
      # content root (/app) at startup - including the NAS shares mounted at
      # /app/documents and /app/archives - which can block boot for minutes when the
      # NAS is slow. Polling only watches the specific appsettings files.
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - JwtSettings__SecretKey=YourSuperSecretKeyForJWTTokenGenerationThatIsLongEnough123456!
      - ConnectionStrings__DefaultConnection=Server=database;Database=ProjectTrackerDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__AzureConnection=Server=tcp:pharmacare.database.windows.net,1433;Initial Catalog=PharmaCare;User ID=pharmacare_admin;Password=Pass@123;Encrypt=True;TrustServerCertificate=True;Connection Timeout=60;
      - KnowledgeBase__DocumentsPath=/app/kb-docs
      - DocumentsPath=/app/documents
      - QuotesPath=/app/quotes
      - DownloadsPath=/app/downloads
      - AttachmentsPath=/app/attachments
      - NasSettings__Host=192.168.10.76
      - NasSettings__ShareName=WorkSpace
      - NasSettings__Username=Storage
      - NasSettings__Password=AccMed@2025
      - Archives__Path=/app/archives
      - Archives__Password=2630
      - Ollama__BaseUrl=http://host.docker.internal:11434
      - Ollama__Model=phi3:mini
      - Ollama__Enabled=false
      # One-time historical movement-history backfill. Set Enabled=false after it completes.
      - MovementHistory__Backfill__Enabled=true
      - MovementHistory__Backfill__FromDate=2026-01-01
      - Claude__ApiKey=${CLAUDE_API_KEY:-}
      - Claude__Model=claude-sonnet-4-20250514
      - Claude__Enabled=true
      - LocalLlm__BaseUrl=http://host.docker.internal:8090
      - LocalLlm__Model=gemma-4-26B-A4B-it-Q4_K_M
      - LocalLlm__Enabled=true
      # Must match LLM_API_KEY used by start-llm-server.ps1 (empty = no auth header sent).
      - LocalLlm__ApiKey=${LOCAL_LLM_API_KEY:-}
      - EmailEnabled=true
      - AzureSync__Enabled=false
      - SearXNG__BaseUrl=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Published on the LAN because the biometric clocking device (/api/device) and the
      # Windows tray notifier call the API directly on :5143. Everything else should go
      # through nginx. Remove this mapping once those clients point at the nginx URL.
      - "0.0.0.0:5143:5143"
    volumes:
      - ./kb-docs:/app/kb-docs
      - ./ai-data:/app/ai-data
      - nas-documents:/app/documents
      - nas-archives:/app/archives:ro
      - ./uploads:/app/uploads
      - C:\Users\Administrator\Documents\quotes:/app/quotes
      - ./downloads:/app/downloads
      - ./attachments:/app/attachments
    depends_on:
      database:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - projecttracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5143/api/aichat/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '4.0'

  # SearXNG - Self-hosted web search engine for Welly
  searxng:
    image: searxng/searxng:latest
    container_name: projecttracker-searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - projecttracker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  # Angular Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: projecttracker-frontend
    ports:
      - "0.0.0.0:4200:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - projecttracker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'

  # Read-only MCP connector that exposes logistics data to Claude (Team).
  mcp-logistics:
    build:
      context: ./mcp-logistics
      dockerfile: Dockerfile
    container_name: projecttracker-mcp-logistics
    environment:
      - PORT=8080
      - PUBLIC_URL=${MCP_PUBLIC_URL:-}
      - ACCESS_PASSWORD=${MCP_ACCESS_PASSWORD:-}
      - DB_SERVER=database
      - DB_PORT=1433
      - DB_NAME=ProjectTrackerDB
      - DB_USER=${MCP_DB_USER:-mcp_readonly}
      - DB_PASSWORD=${MCP_DB_PASSWORD:-McpR3ad0nly@2026!}
      # Root the POD/tripsheet files are stored under, so get_pod_file can read them.
      - DOCS_ROOT=/app/documents
    volumes:
      # Read-only access to the document store so the connector can serve POD PDFs.
      - nas-documents:/app/documents:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - projecttracker-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  # Cloudflare Tunnel. Two modes:
  #  • Quick Tunnel (testing, random URL, no account):
  #      command: tunnel --no-autoupdate --url http://mcp-logistics:8080
  #  • Named Tunnel (stable URL, needs a domain on Cloudflare + token):
  #      set MCP_TUNNEL_TOKEN in .env and use the command below.
  # Read the random URL (quick mode) from: docker compose logs mcp-cloudflared
  mcp-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: projecttracker-mcp-tunnel
    command: ${MCP_TUNNEL_CMD:-tunnel --no-autoupdate --url http://mcp-logistics:8080}
    environment:
      - TUNNEL_TOKEN=${MCP_TUNNEL_TOKEN:-}
    depends_on:
      - mcp-logistics
    networks:
      - projecttracker-network
    restart: unless-stopped

volumes:
  sql-data:
    driver: local
  nas-documents:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.10.76/WorkSpace/IntranetDocuments"
      o: "username=Storage,password=AccMed@2025,vers=3.0,uid=1000,gid=1000"
  nas-archives:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.10.76/WorkSpace/Archives"
      o: "username=Storage,password=AccMed@2025,vers=3.0,uid=1000,gid=1000,ro"
networks:
  projecttracker-network:
    driver: bridge
